<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Cancer Awareness & Support</title>
      <link rel="stylesheet" href="style.css">
  </head>
  <body>
      <header>
          <img src="images/img_4.jpg" alt="Cancer Awareness Banner">
          <h1>Support Cancer Awareness & Research</h1>
      </header>
      <main>
          <section id="about">
              <h2>About Us</h2>
              <p>
                  Join us in spreading awareness about cancer and supporting patients & their families. 
                  Together, we can make a difference!
              </p>
          </section>
          <section id="contact">
              <h2>Contact Us</h2>
              <form id="contactForm">
                  <input type="text" placeholder="Name" required>
                  <input type="email" placeholder="Email" required>
                  <textarea placeholder="Message" required></textarea>
                  <button type="submit">Send</button>
              </form>
          </section>
          <section id="quotes">
              <h2>Inspirational Quote</h2>
              <p id="quote">Loading...</p>
              <button id="newQuoteBtn">New Quote</button>
          </section>
      </main>

      <footer>
          <p> &copy; 2025 Cancer Awareness & Support</p>
      </footer>

      <script src="script.js"></script>
  </body>
</html>
